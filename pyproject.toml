[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-abbreviation-calibration-study"
version = "1.0.0"
description = "Reproducible Qwen3 study of abbreviation knowledge and contextual inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.20,<5",
]
analysis = [
  "Pillow>=10,<13",
]

[project.scripts]
qwen-abbreviation-study = "qwen_abbrev_study.cli:main"

[tool.setuptools.packages.find]
include = ["qwen_abbrev_study*"]
